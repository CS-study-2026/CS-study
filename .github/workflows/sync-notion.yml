name: Sync Notion pages

on:
  workflow_dispatch:
  schedule:
    # Every Tuesday at 23:00 KST.
    - cron: "0 14 * * 2"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate sync script
        run: node --check scripts/sync-notion-pages.mjs

      - name: Find authors with pending pages
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ vars.NOTION_DATA_SOURCE_ID }}
        run: |
          node scripts/sync-notion-pages.mjs \
            --all \
            --write-authors /tmp/notion-authors.json

      - name: Create author branches and pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ vars.NOTION_DATA_SOURCE_ID }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          author_count="$(jq 'length' /tmp/notion-authors.json)"
          if [ "$author_count" = "0" ]; then
            echo "No pending Notion pages."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          jq -c '.[]' /tmp/notion-authors.json | while read -r author; do
            author_id="$(jq -r '.id' <<< "$author")"
            author_name="$(jq -r '.name' <<< "$author")"
            branch="$(jq -r '.branch' <<< "$author")"
            page_ids_file="/tmp/notion-pages-${author_id}.json"
            body_file="/tmp/notion-pr-${author_id}.md"

            echo "Processing ${author_name} (${author_id}) on ${branch}"

            git fetch origin "$DEFAULT_BRANCH"
            git switch -C "$branch" "origin/$DEFAULT_BRANCH"

            node scripts/sync-notion-pages.mjs \
              --user-id "$author_id" \
              --write-page-ids "$page_ids_file"

            if [ -z "$(git status --porcelain)" ]; then
              echo "No file changes for ${author_name}; leaving Notion checkboxes unchanged."
              continue
            fi

            git add .
            git commit -m "docs: sync Notion pages for ${author_name}"
            git push --force-with-lease origin "$branch"

            {
              echo "Notion에서 ${author_name} 작성자의 미업로드 페이지를 동기화했습니다."
              echo ""
              echo "- Source: Notion CS study database"
              echo "- Author: ${author_name}"
              echo "- Generated by: GitHub Actions"
            } > "$body_file"

            if gh pr view "$branch" --repo "$REPOSITORY" --json number >/tmp/existing-pr.json 2>/dev/null; then
              pr_number="$(jq -r '.number' /tmp/existing-pr.json)"
              gh pr edit "$pr_number" \
                --repo "$REPOSITORY" \
                --title "docs: sync Notion pages for ${author_name}" \
                --body-file "$body_file"
              echo "Updated PR #${pr_number}"
            else
              gh pr create \
                --repo "$REPOSITORY" \
                --base "$DEFAULT_BRANCH" \
                --head "$branch" \
                --title "docs: sync Notion pages for ${author_name}" \
                --body-file "$body_file"
            fi

            node scripts/sync-notion-pages.mjs --mark-page-ids "$page_ids_file"
          done
